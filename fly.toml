app = "my-fly-test-app-unique-name" # Change this to a globally unique app name
primary_region = "iad"             # Change to your preferred region (e.g., 'ams', 'lhr', 'sjc')

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
